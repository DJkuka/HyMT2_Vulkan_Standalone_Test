name: Build Hy-MT2 STQ1_0 CPU benchmark APK

on:
  workflow_dispatch:
  push:
    branches: [ hy-mt2-stq1-cpu-benchmark ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout benchmark app
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android platform, NDK and CMake
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch pinned llama-android JNI wrapper
        run: |
          git clone --no-recurse-submodules https://github.com/ffmpegkit-maintained/llama-android.git /tmp/llama-android
          git -C /tmp/llama-android checkout 9f5469fd9fa7ea7bc7b01801923af95dc3b41d52
          rm -rf /tmp/llama-android/llama.cpp
          mkdir -p /tmp/llama-android/llama.cpp
          curl --fail --location --retry 3 https://codeload.github.com/sjl623/llama.cpp/tar.gz/1e411d8f5a1e23525fa3265dfb4bd76265465397 | tar -xz --strip-components=1 -C /tmp/llama-android/llama.cpp
          test -f /tmp/llama-android/llama.cpp/ggml/src/ggml-cpu/arch/arm/quants.c
          grep -q "GGML_TYPE_STQ1_0" /tmp/llama-android/llama.cpp/ggml/include/ggml.h
          echo "Wrapper commit: $(git -C /tmp/llama-android rev-parse HEAD)"
          echo "llama.cpp source pinned to STQ commit: 1e411d8f5a1e23525fa3265dfb4bd76265465397"

      - name: Build CPU-only STQ1_0 Android AAR
        working-directory: /tmp/llama-android
        run: |
          gradle --no-daemon :library:assembleRelease \
            -Pandroid.native.buildOutput=verbose
          mkdir -p "$GITHUB_WORKSPACE/app/libs"
          cp library/build/outputs/aar/library-release.aar \
            "$GITHUB_WORKSPACE/app/libs/llama-android-stq1-cpu.aar"
          sha256sum "$GITHUB_WORKSPACE/app/libs/llama-android-stq1-cpu.aar"

      - name: Verify STQ1_0 CPU AAR
        run: |
          python3 - <<'PY'
          import hashlib, zipfile
          p = "app/libs/llama-android-stq1-cpu.aar"
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              libs = [n for n in names if n.endswith(".so") and "/arm64-v8a/" in n]
              required = ["libllama_jni.so", "libllama.so", "libggml.so", "libggml-base.so", "libggml-cpu.so", "libc++_shared.so"]
              found = {n.rsplit("/", 1)[-1] for n in libs}
              missing = sorted(set(required) - found)
              assert not missing, f"Missing ARM64 native libs: {missing}; found={sorted(found)}"
              assert not any("vulkan" in n.lower() for n in libs), f"Unexpected Vulkan library in CPU-only AAR: {libs}"
              for n in libs:
                  data = z.read(n)
              for n in libs:
                  data = z.read(n)
                  print(n, len(data), hashlib.sha256(data).hexdigest())
              marker_data = b"".join(z.read(n) for n in libs if n.endswith(("libggml-base.so", "libggml-cpu.so")))
              assert b"stq1_0" in marker_data.lower(), "STQ1_0 marker missing from GGML base/CPU libraries"
          print("STQ1_0 CPU AAR verification passed")
          PY

      - name: Build standalone benchmark APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK alignment and native libraries
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/'

      - name: Upload STQ1_0 CPU benchmark APK
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-STQ1-CPU-Benchmark-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime manifest
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-STQ1-CPU-Runtime-Manifest
          path: |
            app/libs/llama-android-stq1-cpu.aar
            native-runtime/STQ1_CPU_BUILD_MANIFEST.json
          if-no-files-found: warn
          retention-days: 14
