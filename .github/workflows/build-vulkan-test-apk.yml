name: Build Hy-MT2 Vulkan standalone test APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: 'yes'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify standalone test project
        run: python3 scripts/test_standalone_project.py

      - name: Verify downloaded Vulkan runtime AAR
        run: |
          python3 scripts/verify_vulkan_runtime.py \
            --aar app/libs/llama-android-vulkan.aar \
            --manifest native-runtime/BUILD_MANIFEST.json

      - name: Build standalone test APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK native libraries
        run: |
          python3 scripts/verify_test_apk.py \
            --apk app/build/outputs/apk/debug/app-debug.apk \
            --manifest native-runtime/BUILD_MANIFEST.json
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-Standalone-Test-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload runtime verification data
        uses: actions/upload-artifact@v4
        with:
          name: HyMT2-Vulkan-Runtime-Verification
          path: |
            native-runtime/BUILD_MANIFEST.json
            native-runtime/README_RUNTIME_RU.txt
          if-no-files-found: error
          retention-days: 14
